<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="İsveç'te fatura kesmek — moms oranları ve ROT indirimi">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f4ed"/>
    <stop offset="0.6" stop-color="#f1ede3"/>
    <stop offset="1" stop-color="#e8e2d4"/>
  </linearGradient>
  <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#13294B" flood-opacity="0.12"/>
  </filter>
  <style>
    .h { font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:800; fill:#13294B; }
    .s { font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:400; fill:#13294B; }
    .k { font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:700; letter-spacing:2.4px; fill:#0359F8; }
    .m { font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:600; fill:#8a8373; }
  </style>
</defs>

<rect width="1200" height="630" fill="url(#g)"/>
<ellipse cx="340" cy="170" rx="450" ry="310" fill="#ffffff" opacity="0.5"/>

<!-- SOL: tipografi -->
<text x="92" y="146" class="k" font-size="15">KURALLARA UYGUN FATURA</text>

<text x="92" y="228" class="h" font-size="60">İlk faturanızı</text>
<text x="92" y="296" class="h" font-size="60">nasıl kesersiniz?</text>

<path d="M94 316 C 250 309, 420 314, 592 310" stroke="#0359F8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>

<text x="92" y="370" class="s" font-size="23" opacity="0.74">Zorunlu alanlar, doğru moms oranı,</text>
<text x="92" y="402" class="s" font-size="23" opacity="0.74">ödeme süresi ve ROT/RUT hesabı.</text>

<text x="92" y="556" class="s" font-size="17" opacity="0.5">isvecenasilgelinir.com</text>

<!-- SAG: moms oran kartlari, merdiven gibi kaydirilmis -->
<g class="h" text-anchor="middle">
  <g transform="translate(726,96) rotate(-2.2)" filter="url(#lift)">
    <rect width="190" height="92" rx="14" fill="#ffffff"/>
    <rect x="0" y="0" width="190" height="5" rx="2.5" fill="#0359F8"/>
    <text x="95" y="56" font-size="34">%25</text>
    <text x="95" y="78" class="m" font-size="12.5" font-weight="600">GENEL ORAN</text>
  </g>
  <g transform="translate(776,208) rotate(1.6)" filter="url(#lift)">
    <rect width="190" height="92" rx="14" fill="#ffffff"/>
    <rect x="0" y="0" width="190" height="5" rx="2.5" fill="#0359F8"/>
    <text x="95" y="56" font-size="34">%12</text>
    <text x="95" y="78" class="m" font-size="12.5" font-weight="600">RESTORAN, OTEL</text>
  </g>
  <g transform="translate(826,320) rotate(-1.2)" filter="url(#lift)">
    <rect width="190" height="92" rx="14" fill="#0359F8"/>
    <text x="95" y="56" font-size="34" fill="#ffffff">%6</text>
    <text x="95" y="78" font-size="12.5" font-weight="600" fill="#ffffff" opacity="0.82">GIDA, KİTAP</text>
  </g>
</g>

<!-- gida orani icin elle cekilmis isaret -->
<path d="M716 372 C 760 362, 790 360, 818 364" stroke="#13294B" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round"/>
<path d="M812 357 L 822 364 L 811 370" stroke="#13294B" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="706" y="368" class="s" font-size="14" text-anchor="end" opacity="0.62">1 Nisan 2026'dan beri</text>

<!-- ROT satiri -->
<g transform="translate(726,452) rotate(-0.8)">
  <rect width="332" height="56" rx="12" fill="#13294B" opacity="0.055"/>
  <text x="22" y="34" class="s" font-size="15" font-weight="700" opacity="0.8">ROT — yalnızca işçilikten</text>
  <text x="310" y="34" class="s" font-size="15" font-weight="700" fill="#0359F8" text-anchor="end">%30</text>
</g>
</svg>
